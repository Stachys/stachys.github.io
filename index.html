    <pre style="background: #f4f4f4; padding: 15px; border-radius: 5px; font-family: Consolas, Monaco, 'Andale Mono', monospace; color: #333; line-height: 1.5;"><span style="color: #0000cd; font-weight: bold;">const</span> x = <span style="color: #d91e18;">1</span>;
{
  console.log(x);
  <span style="color: #0000cd; font-weight: bold;">const</span> x = <span style="color: #d91e18;">2</span>;
}</pre>

  <section>
    <h2 style="margin-bottom: 16px;">What is the result?</h2>
    <pre style="background: #f4f4f4; padding: 15px; border-radius: 5px; font-family: Consolas, Monaco, 'Andale Mono', monospace; color: #333; line-height: 1.5;"><span style="color: #0000cd; font-weight: bold;">const</span> inputs = [<span style="color: #d91e18;">10</span>, <span style="color: #d91e18;">20</span>, <span style="color: #d91e18;">40</span>];
<span style="color: #0000cd; font-weight: bold;">const</span> result = inputs.map((input) =&gt; {
    <span style="color: #0000cd; font-weight: bold;">if</span> (input &gt;<span aria-hidden="true" style="font-size: 0px; opacity: 0; user-select: text;">=</span> <span style="color: #d91e18;">20</span>) {
        <span style="color: #0000cd; font-weight: bold;">return</span> input / <span style="color: #d91e18;">2</span>;
    } <span style="color: #0000cd; font-weight: bold;">else</span> {
        <span style="color: #0000cd; font-weight: bold;">return</span> input * <span style="color: #d91e18;">2</span>;
    }
});</pre>
